<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Critical Path</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen planning workspace — title strip, command ribbon, project overview, then a split task sheet + timeline that fill the rest. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f4f6f9; --hover:#f0f4fb; --sel:#e3eafc;
  --line:#dde2ea; --line-strong:#c3cad6; --fg:#16202d; --muted:#5b6677; --faint:#8b95a5;
  --accent:#2448d6; --accent-fg:#ffffff; --accent-soft:#dfe6fd;
  --bar:#3a68e8; --bar-soft:#a9bdf5; --sum:#1d2633; --crit:#d23c2c; --crit-soft:#f2b3aa;
  --ms:#1d2633; --ok:#1e7f4b; --ok-soft:#dcf1e4; --warn:#a96a10; --warn-soft:#fbecd2;
  --bad:#c4372b; --bad-soft:#fbe0dc; --today:#e0571d; --wkend:#f2f4f8; --link:#6c7789;
  --shadow:0 12px 32px rgba(22,32,45,.16);
  --ui:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --surface:#141b24; --surface-2:#19212c; --hover:#1b2532; --sel:#1f2d4a;
  --line:#243042; --line-strong:#344257; --fg:#e4e9f0; --muted:#97a3b5; --faint:#6c788b;
  --accent:#7090ff; --accent-fg:#0b1020; --accent-soft:#1f2c52;
  --bar:#6087f5; --bar-soft:#2c3f6e; --sum:#d6dde8; --crit:#ff6b5a; --crit-soft:#5a2a27;
  --ms:#d6dde8; --ok:#4cc286; --ok-soft:#173527; --warn:#e3aa48; --warn-soft:#3a2c14;
  --bad:#ff6b5a; --bad-soft:#40201d; --today:#ff8a4a; --wkend:#111820; --link:#7f8ba0;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#141b24; --surface-2:#19212c; --hover:#1b2532; --sel:#1f2d4a;
  --line:#243042; --line-strong:#344257; --fg:#e4e9f0; --muted:#97a3b5; --faint:#6c788b;
  --accent:#7090ff; --accent-fg:#0b1020; --accent-soft:#1f2c52;
  --bar:#6087f5; --bar-soft:#2c3f6e; --sum:#d6dde8; --crit:#ff6b5a; --crit-soft:#5a2a27;
  --ms:#d6dde8; --ok:#4cc286; --ok-soft:#173527; --warn:#e3aa48; --warn-soft:#3a2c14;
  --bad:#ff6b5a; --bad-soft:#40201d; --today:#ff8a4a; --wkend:#111820; --link:#7f8ba0;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:13px;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
#app{height:100%;min-height:560px;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Title strip */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-stretch:118%;font-weight:800;font-size:15px;letter-spacing:-.01em;margin-right:4px}
.brand svg{width:22px;height:22px}
.brand .b1{fill:var(--sum)}.brand .b2{fill:var(--bar)}.brand .b3{fill:var(--crit)}
.picker{display:flex;align-items:center;gap:6px;min-width:0;flex:1 1 220px}
.picker select{min-width:0;max-width:320px;flex:1;height:32px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);padding:0 8px}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.save[data-s="dirty"]::before,.save[data-s="saving"]::before{background:var(--warn)}
.save[data-s="error"]::before{background:var(--bad)}
.save[data-s="local"]::before{background:var(--faint)}

.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.primary.danger{background:var(--bad);border-color:var(--bad);color:#fff}

/* Ribbon */
.ribbon{display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto;scrollbar-width:thin}
.grp{display:flex;flex-direction:column;padding:6px 8px 4px;border-right:1px solid var(--line);flex:none}
.grp:last-child{border-right:0}
.grp-b{display:flex;align-items:center;gap:2px;flex:1}
.grp-l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:center;margin-top:3px}
.rb{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 8px;border:0;background:transparent;border-radius:6px;cursor:pointer;white-space:nowrap}
.rb:hover:not(:disabled){background:var(--hover)}
.rb:disabled{opacity:.35;cursor:default}
.rb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;height:28px;padding:0 9px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.filt{display:flex;gap:6px;align-items:center}
.filt select,.filt input{height:30px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);padding:0 8px;min-width:0}
.filt input{width:150px}
@media (max-width:820px){.rb:not(.keep) .lbl,.seg .lbl{display:none}.rb{padding:0 7px}}

/* Overview */
.overview{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:2px 2px}
.pname{font-stretch:125%;font-weight:800;font-size:22px;letter-spacing:-.02em;border:0;background:transparent;padding:2px 4px;margin-left:-4px;border-radius:6px;min-width:0;width:min(100%,var(--nw,12ch));max-width:100%;text-overflow:ellipsis}
.pname:hover:not(:disabled){background:var(--surface)}
.pname:focus{background:var(--surface);outline:2px solid var(--accent)}
.stats{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center}
.st{display:flex;flex-direction:column;gap:1px}
.st b{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.st span{font-weight:600;font-size:13px;white-space:nowrap}
.st input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 4px;font-weight:600;height:24px}
.prog{display:flex;align-items:center;gap:7px}
.prog i{display:block;width:90px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i::after{content:"";display:block;height:100%;width:var(--p);background:var(--ok)}
.st .late{color:var(--bad)}
.banner{background:var(--warn-soft);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px}

/* Workspace */
.work{flex:1;min-height:300px;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.grid-pane{flex:0 0 var(--left,640px);max-width:calc(100% - 200px)}
.gantt-pane{flex:1 1 0;border-left:1px solid var(--line-strong)}
.splitter{flex:0 0 7px;margin:0 -3px;cursor:col-resize;z-index:5;position:relative;touch-action:none}
.splitter::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:1px}
.splitter:hover::after,.splitter.drag::after{background:var(--accent);width:2px;left:2px}
.gh{height:46px;flex:none;overflow:hidden;border-bottom:1px solid var(--line-strong);background:var(--surface-2)}
.gb{flex:1;overflow:auto;min-height:0;position:relative;overscroll-behavior:contain}
.work.v-sheet .gantt-pane,.work.v-sheet .splitter{display:none}
.work.v-sheet .grid-pane{flex:1 1 auto;max-width:none}
.work.v-gantt .grid-pane{flex:0 0 var(--frozen)}
.work.v-gantt .splitter{display:none}
.work.v-gantt #gridBody{overflow-x:hidden;scrollbar-width:none}
.work.v-gantt #gridBody::-webkit-scrollbar{display:none}

/* Task sheet */
.row{display:grid;grid-template-columns:var(--cols);height:30px;width:max-content;min-width:100%}
.c,.hc{display:flex;align-items:center;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);padding:0 6px;overflow:hidden}
.hc{background:var(--surface-2);height:46px;font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);align-items:flex-end;padding-bottom:7px;border-bottom:0}
.stk{position:sticky;z-index:2}
.row:hover .c{background:var(--hover)}
.row.sel .c{background:var(--sel)}
.c-id{justify-content:flex-end;color:var(--faint);font-family:var(--mono);font-size:11.5px;cursor:pointer;user-select:none;background:var(--surface-2)!important}
.row.sel .c-id{color:var(--accent);box-shadow:inset 3px 0 0 var(--accent);font-weight:500}
.c-ind{justify-content:center;gap:1px;padding:0 2px}
.c-ind .ic{width:13px;height:13px}
.i-bad{color:var(--bad)}.i-ok{color:var(--ok)}.i-note{color:var(--faint)}
.c-name{padding-left:calc(4px + var(--lvl) * 18px);gap:2px}
.caret{width:18px;height:18px;border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none;border-radius:4px}
.caret:hover{background:var(--line)}
.caret .ic{width:12px;height:12px;stroke-width:2;transition:transform .15s}
.caret[aria-expanded="false"] .ic{transform:rotate(-90deg)}
.nocaret{width:18px;flex:none}
.row.sum .c{font-weight:700}
.row.sum .c-name .in{font-stretch:105%}
.row.crit .c-name .in{color:var(--crit)}
.in{width:100%;min-width:0;border:0;background:transparent;padding:4px 3px;border-radius:4px;height:24px}
.in:focus{outline:2px solid var(--accent);background:var(--surface);outline-offset:0}
.in:disabled{color:inherit;opacity:1}
.in[type=number]{text-align:right;-moz-appearance:textfield;appearance:textfield}
.in::-webkit-outer-spin-button,.in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.in[type=date]{font-size:12px;padding:1px;letter-spacing:-.01em}
.c{padding:0 4px}
.hc{padding:0 5px 7px;font-size:10.5px;letter-spacing:.03em}
.ro{color:var(--fg);padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro.r{margin-left:auto}
.c-pct{position:relative;gap:6px}
.pb{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:20px}
.pb::after{content:"";display:block;height:100%;width:var(--p);background:var(--ok)}
.c-pct .in{width:36px;flex:none}
.c-pct .ro{width:36px;text-align:right;flex:none}
.c-pct{gap:4px}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.late{background:var(--bad-soft);color:var(--bad)}
.pill.future{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.newrow .c{background:var(--surface)}
.newrow .c-id{color:var(--accent)}
.newrow .in::placeholder{color:var(--faint)}
.spacer{height:60px}

/* Timeline */
.gsvg{display:block}
.g-top{fill:var(--fg);font-size:11.5px;font-weight:650}
.g-bot{fill:var(--muted);font-size:11px}
.g-bot.we{fill:var(--faint)}
.g-sep{stroke:var(--line-strong);stroke-width:1}
.g-sepl{stroke:var(--line);stroke-width:1}
.rowbg{fill:transparent}
.rowbg.sel{fill:var(--sel)}
.hl{stroke:var(--line);stroke-width:1}
.wk{fill:var(--wkend)}
.today{stroke:var(--today);stroke-width:1.5;stroke-dasharray:4 3}
.today-t{fill:var(--today);font-size:10px;font-weight:700;letter-spacing:.06em}
.bar .tr{fill:var(--bar-soft)}
.bar .pr{fill:var(--bar)}
.bar.crit .tr{fill:var(--crit-soft)}
.bar.crit .pr{fill:var(--crit)}
.bar .hd{fill:transparent;cursor:ew-resize}
.bar[data-drag],.ms[data-drag]{cursor:grab;touch-action:none}
.bar.dragging,.ms.dragging{cursor:grabbing;opacity:.85}
.bar.sel .tr,.ms.sel path{stroke:var(--fg);stroke-width:1.5}
.sumb{fill:var(--sum)}
.sumb.crit{fill:var(--crit)}
.ms path{fill:var(--ms)}
.ms.crit path{fill:var(--crit)}
.lbl-t{fill:var(--muted);font-size:11.5px}
.lnk{fill:none;stroke:var(--link);stroke-width:1.2}
.lnk.crit{stroke:var(--crit)}
.arr{fill:var(--link)}
.arr.crit{fill:var(--crit)}
.due path{stroke-width:0}
.due.met path{fill:var(--ok)}
.due.miss path{fill:var(--bad)}
.drag-tip{position:fixed;z-index:60;background:var(--fg);color:var(--bg);font-size:12px;padding:5px 8px;border-radius:6px;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow)}

/* Empty / loading */
.empty{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:var(--surface);z-index:8}
.empty-card{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty-card h2{margin:0;font-stretch:120%;font-weight:800;font-size:20px;text-wrap:balance}
.empty-card p{margin:0;color:var(--muted);line-height:1.5}
.empty-card .row-b{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* Drawer */
.drawer{position:fixed;z-index:40;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer h2{margin:0;font-size:15px;font-stretch:115%;font-weight:800}
.dbody{flex:1;overflow:auto;padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld textarea,.fld select{border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);padding:6px 8px;min-width:0;width:100%}
.fld textarea{min-height:110px;resize:vertical;line-height:1.45}
.fld .hint{font-size:11.5px;color:var(--faint);line-height:1.4}
.fld .rov{padding:7px 0;font-weight:600}
.fld input[type=range]{padding:0;border:0;accent-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.chk input{width:auto}
.drawer footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;
  padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
@media (max-width:640px){
  .drawer{top:auto;left:0;width:100%;max-height:82%;border-left:0;border-top:1px solid var(--line-strong);border-radius:14px 14px 0 0;padding-left:env(safe-area-inset-left,0px)}
}

/* Popover / modal / toast */
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;box-shadow:var(--shadow);padding:6px;min-width:200px;display:flex;flex-direction:column;max-height:70vh;overflow:auto}
.pop .mi{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 10px;border-radius:6px;text-align:left;cursor:pointer;white-space:nowrap}
.pop .mi:hover:not(:disabled){background:var(--hover)}
.pop .mi:disabled{opacity:.4;cursor:default}
.pop .mi.danger{color:var(--bad)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.pop label.mi{cursor:pointer}
.pop .ph{font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:6px 10px 2px}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(10,14,20,.45);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(460px,100%);max-height:90%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:17px;font-stretch:115%;font-weight:800;text-wrap:balance}
.modal p{margin:0;color:var(--muted);line-height:1.5}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
.modal textarea{width:100%;min-height:200px;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface-2);padding:8px}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kbd kbd{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px;white-space:nowrap}
.toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 22 22" aria-hidden="true"><rect class="b1" x="2" y="3" width="11" height="4" rx="1"/><rect class="b2" x="6" y="9" width="12" height="4" rx="1"/><rect class="b3" x="11" y="15" width="9" height="4" rx="1"/></svg>
      Critical Path
    </div>
    <div class="picker">
      <select id="projSel" aria-label="Open project"></select>
      <button class="btn" id="newProj" type="button"></button>
      <button class="btn" id="moreBtn" type="button" aria-haspopup="true" aria-label="Project menu"></button>
    </div>
    <div class="save" id="saveStat" data-s="ok">Loading…</div>
  </div>

  <div class="ribbon" id="ribbon"></div>

  <div class="overview" id="overview" hidden>
    <input class="pname" id="pname" aria-label="Project name">
    <div class="stats" id="stats"></div>
  </div>
  <div class="banner" id="banner" hidden></div>

  <main class="work v-split" id="work">
    <section class="pane grid-pane" id="gridPane">
      <div class="gh" id="gridHead"></div>
      <div class="gb" id="gridBody"></div>
    </section>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize panes"></div>
    <section class="pane gantt-pane" id="ganttPane">
      <div class="gh" id="ganttHead"></div>
      <div class="gb" id="ganttBody"></div>
    </section>
    <div class="empty" id="empty"></div>
  </main>
  <datalist id="people"></datalist>
</div>
<aside class="drawer" id="drawer" hidden aria-label="Task details"></aside>
<input type="file" id="fileIn" accept=".json,.csv,.xml,application/json,text/csv,text/xml" hidden>

<script>
(function(){
'use strict';
/* ---------------- constants & helpers ---------------- */
const RH=30, DAY=864e5;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pISO=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}/.test(s))return null;const[y,m,d]=s.slice(0,10).split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/DAY);};

const wd=dn=>{const d=dn-4,w=Math.floor(d/7),k=d-w*7;return k>=5?(w+1)*5:w*5+k;};

/* ---------------- scheduling engine ---------------- */
function subEnd(T,i){let j=i+1;while(j<T.length&&T[j].level>T[i].level)j++;return j;}
function sched(P){
  const T=P.tasks,n=T.length,base=wd(pISO(P.start)??todayDN);
  const ix=new Map();T.forEach((t,i)=>ix.set(t.id,i));
  const isSum=T.map((t,i)=>i+1<n&&T[i+1].level>t.level);
  const par=new Array(n).fill(-1),end=new Array(n).fill(n),st=[];
  for(let i=0;i<n;i++){while(st.length&&T[st[st.length-1]].level>=T[i].level)end[st.pop()]=i;par[i]=st.length?st[st.length-1]:-1;st.push(i);}
  const Sw=new Array(n),Ew=new Array(n),flag=new Array(n).fill(0),sumF=new Array(n),sumMs=new Array(n);let cycle=false;
  const effPreds=i=>{const o=[];for(let a=i;a!==-1;a=par[a])for(const p of(T[a].preds||[])){const j=ix.get(p.id);if(j!=null)o.push([j,p.lag||0]);}return o;};
  function calc(i){
    if(flag[i]===2)return true;if(flag[i]===1){cycle=true;return false;}
    flag[i]=1;
    if(isSum[i]){let s=Infinity,e=-Infinity,f=-Infinity,allMs=true;for(let k=i+1;k<end[i];k++){if(isSum[k])continue;calc(k);const d=T[k].dur||0;if(d)allMs=false;if(Sw[k]<s)s=Sw[k];if(Ew[k]>e)e=Ew[k];const fk=d?Sw[k]+d-1:Sw[k];if(fk>f)f=fk;}
      if(!isFinite(s)){s=base;e=base;f=base;}Sw[i]=s;Ew[i]=Math.max(e,s);sumF[i]=f;sumMs[i]=allMs;}
    else{const t=T[i];let s=pISO(t.start)!=null?wd(pISO(t.start)):base;let m=-Infinity;
      for(const[j,lag]of effPreds(i)){if(calc(j))m=Math.max(m,Ew[j]+lag);}
      if(m>-Infinity)s=Math.max(s,m);Sw[i]=s;Ew[i]=s+(t.dur||0);}
    flag[i]=2;return true;
  }
  for(let i=0;i<n;i++)calc(i);
  const Fw=new Array(n),dur=new Array(n),pct=new Array(n);
  for(let i=0;i<n;i++){if(isSum[i]){Fw[i]=sumF[i];dur[i]=sumMs[i]?0:Fw[i]-Sw[i]+1;}else{dur[i]=T[i].dur||0;Fw[i]=dur[i]?Sw[i]+dur[i]-1:Sw[i];}}
  for(let i=0;i<n;i++){
    if(!isSum[i]){pct[i]=clamp(T[i].pct||0,0,100);continue;}
    let w=0,pw=0,c=0,ps=0;for(let k=i+1;k<end[i];k++){if(isSum[k])continue;const d=T[k].dur||0,p=clamp(T[k].pct||0,0,100);w+=d;pw+=d*p;c++;ps+=p;}
    pct[i]=Math.round(w?pw/w:(c?ps/c:0));
  }
  // backward pass for total slack (leaves only)
  let projE=-Infinity;for(let i=0;i<n;i++)if(!isSum[i])projE=Math.max(projE,Ew[i]);
  const succ=Array.from({length:n},()=>[]);
  for(let j=0;j<n;j++){if(isSum[j])continue;for(const[k,lag]of effPreds(j)){if(isSum[k]){for(let l=k+1;l<end[k];l++)if(!isSum[l])succ[l].push([j,lag]);}else succ[k].push([j,lag]);}}
  const LS=new Array(n),fl2=new Array(n).fill(0);
  function late(i){if(fl2[i]===2)return LS[i];if(fl2[i]===1)return Sw[i];fl2[i]=1;let le=projE;for(const[j,lag]of succ[i])le=Math.min(le,late(j)-lag);LS[i]=le-(T[i].dur||0);fl2[i]=2;return LS[i];}
  const slack=new Array(n).fill(0),crit=new Array(n).fill(false);
  for(let i=0;i<n;i++){if(isSum[i])continue;slack[i]=late(i)-Sw[i];crit[i]=slack[i]<=0;}
  for(let i=n-1;i>=0;i--){if(isSum[i]){for(let k=i+1;k<end[i];k++)if(crit[k]){crit[i]=true;break;}}}
  const sDN=Sw.map(dnOf),fDN=Fw.map(dnOf);
  return{T,n,ix,isSum,par,end,Sw,Ew,Fw,dur,pct,slack,crit,sDN,fDN,cycle};
}
function statusOf(sc,i){
  const p=sc.pct[i];if(p>=100)return['Complete','done'];
  const S0=sc.sDN[i],d=sc.dur[i];
  if(d===0){if(S0<todayDN)return['Late','late'];return S0>todayDN?['Future','future']:['On schedule','ok'];}
  if(S0>todayDN)return['Future','future'];
  const tW=finWD(todayDN),isWork=dowOf(todayDN)>=1&&dowOf(todayDN)<=5;
  const elapsed=clamp((isWork?tW-sc.Sw[i]:tW-sc.Sw[i]+1),0,d);
  const exp=elapsed/d*100;
  return p+0.5<exp?['Late','late']:['On schedule','ok'];
}
function missedDue(sc,i){const t=sc.T[i];const dd=pISO(t.due);return dd!=null&&sc.fDN[i]>dd;}

/* ---------------- parsing ---------------- */
function parseDur(v){
  v=String(v).trim().toLowerCase().replace(/\?$/,'');if(v==='')return null;
  const m=v.match(/^(\d+(?:[.,]\d+)?)\s*(d|days?|w|wks?|weeks?|mo|mons?|months?|h|hrs?|hours?)?$/);if(!m)return null;
  let n=parseFloat(m[1].replace(',','.'));const u=m[2]||'d';
  if(/^w/.test(u))n*=5;else if(/^mo/.test(u))n*=20;else if(/^h/.test(u))n/=8;
  return Math.max(0,Math.round(n));
}
function parseLag(s){
  if(!s)return 0;const m=s.replace(/\s+/g,'').toLowerCase().match(/^([+-]\d+(?:\.\d+)?)(d|days?|w|wks?|weeks?|ed|edays?)?$/);
  if(!m)return null;let n=parseFloat(m[1]);if(m[2]&&/^w/.test(m[2]))n*=5;return Math.round(n);
}
/* "3, 5FS+2d" → [{id,lag}] using row numbers (or a custom id→task map) */
function parsePreds(text,T,selfId,map){
  const out=[];const parts=String(text||'').split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  for(const p of parts){
    const m=p.match(/^(\d+)\s*(FS|SS|FF|SF)?\s*([+-].*)?$/i);if(!m)return{error:`“${p}” isn't a task number. Use row numbers like 3 or 3+2d.`};
    if(m[2]&&m[2].toUpperCase()!=='FS')return{error:'Only finish-to-start links are supported, e.g. 3 or 3FS+2d.'};
    const lag=parseLag(m[3]);if(lag==null)return{error:`Couldn't read the lag in “${p}”. Try 3+2d or 3-1d.`};
    const t=map?map.get(m[1]):T[parseInt(m[1],10)-1];
    if(!t)return{error:`There's no task ${m[1]}.`};if(t.id===selfId)return{error:'A task cannot depend on itself.'};
    if(!out.some(o=>o.id===t.id))out.push({id:t.id,lag});
  }
  return{list:out};
}
function predsText(t,sc){return(t.preds||[]).map(p=>{const j=sc.ix.get(p.id);if(j==null)return null;return(j+1)+(p.lag?(p.lag>0?'+':'')+p.lag+'d':'');}).filter(Boolean).join(', ');}

/* ---------------- persistence ---------------- */
let saveTimer=null,saving=false,saveAgain=false;
function setStat(s,txt){const el=$('#saveStat');el.dataset.s=s;el.textContent=txt;}
function scheduleSave(){S.dirty=true;setStat('dirty','Unsaved changes');clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);}
function docBody(P){return{name:P.name,start:P.start,tasks:P.tasks,rev:P.rev||0,savedBy:clientId,updatedAt:Date.now(),format:'critical-path/1'};}
async function flush(){
  if(!S.P||!S.dirty)return;if(saving){saveAgain=true;return;}
  saving=true;S.dirty=false;S.P.rev=(S.P.rev||0)+1;const id=S.curId;const body=JSON.parse(JSON.stringify(docBody(S.P)));
  setStat('saving','Saving…');
  try{
    if(S.mode==='db'){
      if(JSON.stringify(body).length>250000){toast('This project is too large to save online. Split it into smaller projects or export it.');throw{code:'too_big'};}
      await writeDoc(id,body);setStat('ok','Saved');
    }else{S.projects[id]=body;saveLocal();setStat('local','Saved in this browser');}
  }catch(e){
    S.dirty=true;
    if(e&&e.code==='invalid_argument'){setReadOnly(true);setStat('error','View only');toast("You can view this plan but you don't have permission to change it.");}
    else if(e&&e.code==='quota_exceeded'){setStat('error','Not saved');toast('Storage is full: '+(e.message||'delete an old project and try again.'));}
    else if(e&&e.code!=='too_big'){setStat('error','Not saved');toast("Changes couldn't be saved. They'll retry on your next edit.");}
  }
  saving=false;if(saveAgain){saveAgain=false;flush();}
}
async function writeDoc(id,body){
  try{await S.db.doc('projects/'+id).set(body);}
  catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*900));await S.db.doc('projects/'+id).set(body);}else throw e;}
}
function saveLocal(){lsSet('cp.local',S.projects);}
function loadLocal(){S.projects=lsGet('cp.local',{})||{};S.loaded=true;const id=pickInitial();openProject(id);}
function pickInitial(){const ids=Object.keys(S.projects);if(!ids.length)return null;const want=lsGet('cp.cur',null);if(want&&S.projects[want])return want;
  return ids.sort((a,b)=>(S.projects[b].updatedAt||0)-(S.projects[a].updatedAt||0))[0];}

function onProjects(snap){
  const map={};snap.docs.forEach(d=>{if(d.exists)map[d.id]=d.data();});
  S.projects=map;S.loaded=true;
  if(!S.curId||!map[S.curId]){openProject(pickInitial());return;}
  const remote=map[S.curId];
  if(remote!==S.lastRemote){
    S.lastRemote=remote;
    if(remote.savedBy!==clientId&&(remote.rev||0)!==(S.P&&S.P.rev)){
      const typing=document.activeElement&&document.activeElement.matches('input:not([type=date]):not([type=range]),textarea');
      if(S.dirty||typing){S.pendingRemote=true;}else applyRemote(remote);
    }
  }
  renderPicker();
}
function applyRemote(remote){S.pendingRemote=false;const P=JSON.parse(JSON.stringify(remote));P.id=S.curId;S.P=P;S.redo=[];setStat('ok','Updated');render();}
function onDbError(e){if(e&&e.code==='revoked'){setReadOnly(true);}toast('Live updates stopped. Reload the page to reconnect.');}

function openProject(id){
  S.curId=id||null;S.sel.clear();S.anchor=null;S.undo=[];S.redo=[];S.drawer=false;S.pendingRemote=false;
  if(id&&S.projects[id]){S.P=JSON.parse(JSON.stringify(S.projects[id]));S.P.id=id;S.lastRemote=S.projects[id];lsSet('cp.cur',id);}
  else S.P=null;
  if(S.mode==='db')setStat('ok',S.canWrite?'Saved':'View only');else if(S.mode==='local')setStat('local','Saved in this browser');
  renderPicker();render();

}
async function createProject(name,start,tasks){
  if(!S.canWrite){toast("You can view projects here but can't create them.");return;}
  const id='p-'+uid();const body=docBody({name,start,tasks:tasks||[],rev:1});
  S.projects[id]=body;
  if(S.mode==='db'){try{await writeDoc(id,body);}catch(e){delete S.projects[id];toast(e&&e.code==='quota_exceeded'?'Storage is full. Delete an old project first.':"The project couldn't be created. Try again.");return;}}

async function deleteProject(){
  if(!S.P)return;const id=S.curId,name=S.P.name;
  confirmBox(`Delete “${name}”?`,'This removes the project and all of its tasks for everyone who has this page. It cannot be undone.','Delete project',async()=>{
    clearTimeout(saveTimer);S.dirty=false;
    try{if(S.mode==='db')await S.db.doc('projects/'+id).delete();delete S.projects[id];if(S.mode==='local')saveLocal();}
    catch(e){toast("The project couldn't be deleted. Try again.");return;}
    openProject(pickInitial());toast('Project deleted');

}
function setReadOnly(ro){S.canWrite=!ro;const b=$('#banner');if(ro){b.hidden=false;b.textContent="View only — you can browse this plan, filter it and export it, but changes won't be saved.";}else b.hidden=true;render();}

/* ---------------- mutations ---------------- */
function snapP(){return JSON.stringify({name:S.P.name,start:S.P.start,tasks:S.P.tasks});}
function restoreP(s){Object.assign(S.P,JSON.parse(s));}
function commit(fn,opt){
  if(!S.canWrite||!S.P){requestRender();return false;}
  const before=snapP();fn();
  if(opt&&opt.checkCycle&&sched(S.P).cycle){restoreP(before);toast('That link would make tasks wait on each other in a loop, so it was not added.');requestRender();return false;}
  if(snapP()===before){requestRender();return false;}
  S.undo.push(before);if(S.undo.length>150)S.undo.shift();S.redo=[];
  scheduleSave();requestRender();return true;
}
function undo(){if(!S.undo.length||!S.canWrite)return;S.redo.push(snapP());restoreP(S.undo.pop());scheduleSave();requestRender();}
function redo(){if(!S.redo.length||!S.canWrite)return;S.undo.push(snapP());restoreP(S.redo.pop());scheduleSave();requestRender();}

function taskIdx(id){return S.P.tasks.findIndex(t=>t.id===id);}
function selIdx(){return[...S.sel].map(taskIdx).filter(i=>i>=0).sort((a,b)=>a-b);}
function newTask(o){return Object.assign({id:uid(),name:'New task',level:0,dur:1,start:S.P.start,due:null,pct:0,owner:'',preds:[],notes:''},o);}

function setField(id,f,v){
  if(!S.P)return;const i=taskIdx(id);if(i<0)return;const t=S.P.tasks[i],sc=S.sc,sum=sc&&sc.isSum[i];
  switch(f){
    case'name':v=String(v).trim()||'Untitled task';commit(()=>{t.name=v;});break;
    case'dur':{if(sum)return requestRender();const d=parseDur(v);if(d==null){toast('Enter a duration such as 5, 5d or 2w.');return requestRender();}commit(()=>{t.dur=d;});break;}
    case'start':{if(sum||!v)return requestRender();const dn=pISO(v);if(dn==null)return requestRender();commit(()=>{t.start=iso(dnOf(wd(dn)));});break;}
    case'finish':{if(sum||!v)return requestRender();const dn=pISO(v);if(dn==null)return requestRender();const fw=finWD(dn),s0=sc.Sw[i];
      commit(()=>{if(fw>=s0)t.dur=Math.max(t.dur===0&&fw===s0?0:1,fw-s0+1);else{const d=Math.max(1,t.dur||1);t.start=iso(dnOf(fw-d+1));}});break;}
    case'due':commit(()=>{t.due=v||null;});break;
    case'pct':{if(sum)return requestRender();const n=Math.round(parseFloat(v));if(isNaN(n))return requestRender();commit(()=>{t.pct=clamp(n,0,100);});break;}
    case'owner':commit(()=>{t.owner=String(v).trim();});break;
    case'notes':commit(()=>{t.notes=String(v);});break;
    case'milestone':if(sum)return;commit(()=>{t.dur=v?0:Math.max(1,t.dur||1);});break;
    case'preds':{const r=parsePreds(v,S.P.tasks,t.id);if(r.error){toast(r.error);return requestRender();}
      commit(()=>{const had=(t.preds||[]).length;t.preds=r.list;if(!had&&r.list.length)t.start=S.P.start;},{checkCycle:true});break;}
  }
}
function insertTask(ms){
  if(!S.P||!S.canWrite)return;const T=S.P.tasks;const sc=S.sc;const ii=selIdx();
  let at=T.length,level=T.length?T[T.length-1].level:0,start=S.P.start;
  if(ii.length){const i=ii[ii.length-1];start=iso(sc.sDN[i]);

const ZOOM={day:28,week:11,month:3.6};

  const focusDN=lo;

  if(S.zoom==='month'){const d=new Date(lo*DAY);lo=Math.round(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)/DAY);}else lo-=((dowOf(lo)+6)%7);
  const minDays=Math.ceil((gb.clientWidth||900)/dw)+2;hi=Math.max(hi,lo+minDays);

  // header
  let top='',bot='';
  const months=[];{let d=new Date(lo*DAY),y=d.getUTCFullYear(),m=d.getUTCMonth();while(true){const s=Math.round(Date.UTC(y,m,1)/DAY);if(s>hi)break;const e=Math.round(Date.UTC(y,m+1,1)/DAY);months.push({s:Math.max(s,lo),e:Math.min(e,hi+1),y,m,real:s});m++;if(m>11){m=0;y++;}}}
  if(S.zoom==='month'){
    const years={};months.forEach(o=>{(years[o.y]=years[o.y]||{s:o.s,e:o.e}).e=o.e;});
    Object.keys(years).forEach(y=>{const o=years[y];top+=`<line class="g-sep" x1="${x(o.s)}" y1="0" x2="${x(o.s)}" y2="23"/><text class="g-top" x="${x(o.s)+6}" y="16">${y}</text>`;});
    months.forEach(o=>{const w=x(o.e)-x(o.s);bot+=`<line class="g-sepl" x1="${x(o.s)}" y1="23" x2="${x(o.s)}" y2="46"/>${w>24?`<text class="g-bot" x="${x(o.s)+(w>40?5:3)}" y="39">${w>40?MON[o.m]:MON[o.m][0]}</text>`:''}`;});
  }else{
    months.forEach(o=>{const w=x(o.e)-x(o.s);const lab=w>110?`${MONL[o.m]} ${o.y}`:w>56?`${MON[o.m]} ${o.y}`:w>26?MON[o.m]:'';top+=`<line class="g-sep" x1="${x(o.s)}" y1="0" x2="${x(o.s)}" y2="23"/>${lab?`<text class="g-top" x="${x(o.s)+6}" y="16">${lab}</text>`:''}`;});

  // body

    const crit=S.critical&&sc.crit[i]&&sc.crit[j]&&!sc.isSum[i]&&!sc.isSum[j];
    const x1=isMs(i)?x(sc.sDN[i])+dw/2+7:x(sc.fDN[i]+1),y1=vi*RH+RH/2,x2=isMs(j)?x(sc.sDN[j])+dw/2:x(sc.sDN[j]),y2=vj*RH+RH/2;
    const down=vj>vi;let d,ax,ay,dir;

    if(tipX>=x1+6){const ey=down?y2-8:y2+8;d=`M${x1} ${y1}H${tipX}V${ey}`;ax=tipX;ay=ey;dir=down?'d':'u';}
    else{const my=down?vi*RH+RH:vi*RH;const ex=(isMs(j)?x2-7:x2)-1;d=`M${x1} ${y1}H${x1+7}V${my}H${ex-8}V${y2}H${ex}`;ax=ex;ay=y2;dir='r';}
    const ah=dir==='d'?`M${ax-3.5} ${ay-4}L${ax+3.5} ${ay-4}L${ax} ${ay+1}z`:dir==='u'?`M${ax-3.5} ${ay+4}L${ax+3.5} ${ay+4}L${ax} ${ay-1}z`:`M${ax-5} ${ay-3.5}L${ax-5} ${ay+3.5}L${ax} ${ay}z`;
    links+=`<path class="lnk${crit?' crit':''}" d="${d}"/><path class="arr${crit?' crit':''}" d="${ah}"/>`;}});

    else if(sc.dur[i]===0){const cx=x(sc.sDN[i])+dw/2,cy=y+RH/2;
      g+=`<g class="ms${crit?' crit':''}${sel?' sel':''}" data-id="${esc(t.id)}"${drag?' data-drag':''}>${tip}<path d="M${cx} ${cy-7}L${cx+7} ${cy}L${cx} ${cy+7}L${cx-7} ${cy}Z"/><text class="lbl-t" x="${cx+12}" y="${cy+4}">${fmtS(sc.sDN[i])}${lab?' · '+lab:''}</text></g>`;}
    else{const x1=x(sc.sDN[i]),x2=x(sc.fDN[i]+1),w=Math.max(3,x2-x1-1),yy=y+8;

  });

const xe=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));

function buildCSV(){
  const sc=sched(S.P),T=sc.T;const head=['ID','Outline Level','Name','Duration','Start','Finish','Deadline','% Complete','Resource Names','Predecessors','Status','Notes'];

function buildXML(){

  T.forEach((t,i)=>{const sum=sc.isSum[i],ms=!sum&&sc.dur[i]===0;
    let cons='';const own=pISO(t.start);if(!sum&&own!=null&&own>ps)cons=`<ConstraintType>4</ConstraintType><ConstraintDate>${dt(own,'08')}</ConstraintDate>`;else cons='<ConstraintType>0</ConstraintType>';
    x+=`<Task><UID>${i+1}</UID><ID>${i+1}</ID><Name>${xe(t.name)}</Name><Manual>0</Manual><OutlineLevel>${t.level+1}</OutlineLevel><Start>${dt(sc.sDN[i],'08')}</Start><Finish>${dt(sc.fDN[i],ms?'08':'17')}</Finish><Duration>PT${sc.dur[i]*8}H0M0S</Duration><DurationFormat>7</DurationFormat><Milestone>${ms?1:0}</Milestone><Summary>${sum?1:0}</Summary><PercentComplete>${sc.pct[i]}</PercentComplete>${cons}${t.due?`<Deadline>${dt(pISO(t.due),'17')}</Deadline>`:''}${t.notes?`<Notes>${xe(t.notes)}</Notes>`:''}`;
    (t.preds||[]).forEach(p=>{const j=sc.ix.get(p.id);if(j!=null)x+=`<PredecessorLink><PredecessorUID>${j+1}</PredecessorUID><Type>1</Type><CrossProject>0</CrossProject><LinkLag>${(p.lag||0)*4800}</LinkLag><LagFormat>7</LagFormat></PredecessorLink>`;});
    x+=`</Task>\n`;});

  let a=1;T.forEach((t,i)=>{if(sc.isSum[i])return;splitOwners(t.owner).forEach(o=>{x+=`<Assignment><UID>${a++}</UID><TaskUID>${i+1}</TaskUID><ResourceUID>${people.indexOf(o)+1}</ResourceUID><Units>1</Units></Assignment>\n`;});});
  return x+`</Assignments>\n</Project>\n`;
}
async function exportAs(kind){
  if(!S.P)return;const base=(S.P.name||'project').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'project';
  const out=kind==='csv'?{f:base+'.csv',d:buildCSV()}:kind==='xml'?{f:base+'.xml',d:buildXML()}:{f:base+'.json',d:JSON.stringify({format:'critical-path/1',name:S.P.name,start:S.P.start,tasks:S.P.tasks},null,2)};
  if(S.dl){try{await S.dl.save({filename:out.f,data:out.d});toast('Saved '+out.f);return;}catch(e){if(e&&e.code==='declined')return;}}
  if(!(window.claude&&window.claude.use)){try{const url=URL.createObjectURL(new Blob([out.d],{type:'application/octet-stream'}));const l=document.createElement('a');l.href=url;l.download=out.f;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Downloaded '+out.f);return;}catch(e){}}
  modal(`<h3>Copy ${esc(out.f)}</h3><p>Downloads aren't available here, so copy the contents below and save them as <b>${esc(out.f)}</b>.</p><textarea readonly>${esc(out.d)}</textarea><div class="acts"><button class="btn" type="button" data-x>Close</button><button class="btn primary" type="button" data-c>Copy</button></div>`,
   s=>{s.querySelector('[data-x]').onclick=closeModal;s.querySelector('[data-c]').onclick=()=>{const ta=s.querySelector('textarea');navigator.clipboard.writeText(out.d).then(()=>toast('Copied'),()=>{ta.focus();ta.select();toast('Press Ctrl/⌘+C to copy');});};});
}
function parseCSVText(text){
  text=text.replace(/^﻿/,'');const rows=[];let row=[],cell='',q=false;
  const delim=(text.split('\n')[0].split(';').length>text.split('\n')[0].split(',').length)?';':',';
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;else if(c===delim){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=c;}
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function parseAnyDate(s){
  s=String(s||'').trim();if(!s||/^(na|n\/a)$/i.test(s))return null;
  let d=pISO(s);if(d!=null)return d;
  s=s.replace(/^[A-Za-z]{2,9}\.?,?\s+(?=\d)/,'');
  let m=s.match(/^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})/);if(m)return Math.round(Date.UTC(+m[1],+m[2]-1,+m[3])/DAY);
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if(m){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;let day=a,mon=b;if(b>12&&a<=12){day=b;mon=a;}return Math.round(Date.UTC(y,mon-1,day)/DAY);}
  const t=Date.parse(s.replace(/\s+\d{1,2}:\d{2}.*$/,''));if(!isNaN(t)){const dd=new Date(t);return Math.round(Date.UTC(dd.getFullYear(),dd.getMonth(),dd.getDate())/DAY);}
  return null;
}
function fromCSV(text){
  const rows=parseCSVText(text);if(rows.length<2)throw new Error('The CSV file has no task rows.');
  const h=rows[0].map(s=>s.trim().toLowerCase());
  const find=(...names)=>h.findIndex(x=>names.includes(x));
  const c={id:find('id','#','unique id'),lvl:find('outline level','level'),name:find('name','task name','task'),dur:find('duration','duration (days)'),
    start:find('start','start date','start_date'),fin:find('finish','finish date','end','end date'),due:find('deadline','due','due date'),
    pct:find('% complete','percent complete','% complete (%)','complete','progress'),own:find('resource names','responsible','owner','assigned to','resource','resources'),
    pred:find('predecessors','depends on'),notes:find('notes')};
  if(c.name<0)throw new Error('Couldn’t find a “Name” or “Task Name” column.');
  const tasks=[],idMap=new Map(),rawPreds=[];
  rows.slice(1).forEach((r,k)=>{const g=i=>i>=0?(r[i]||'').trim():'';const name=g(c.name);if(!name)return;
    const s=parseAnyDate(g(c.start)),f=parseAnyDate(g(c.fin));let dur=parseDur(g(c.dur).replace(/\?$/,'').replace(/\s*e?days?$/i,'d').replace(/\s+/,''));
    if(dur==null&&s!=null&&f!=null)dur=Math.max(1,finWD(f)-wd(s)+1);if(dur==null)dur=1;
    const t={id:uid(),name,level:Math.max(0,(parseInt(g(c.lvl),10)||1)-1),dur,start:s!=null?iso(dnOf(wd(s))):null,due:(()=>{const d=parseAnyDate(g(c.due));return d!=null?iso(d):null;})(),
      pct:clamp(parseInt(g(c.pct),10)||0,0,100),owner:g(c.own).replace(/\[[^\]]*\]/g,'').trim(),preds:[],notes:g(c.notes)};
    tasks.push(t);idMap.set(g(c.id)||String(tasks.length),t);rawPreds.push(g(c.pred));});
  fixLevels(tasks);
  tasks.forEach((t,i)=>{if(!rawPreds[i])return;const txt=rawPreds[i].replace(/\s*e?days?/gi,'d').replace(/\s*e?wks?|\s*weeks?/gi,'w');const r=parsePreds(txt,tasks,t.id,idMap);if(r.list)t.preds=r.list;});
  return{tasks};
}
function fixLevels(tasks){let prev=-1;tasks.forEach(t=>{if(t.level>prev+1)t.level=prev+1;prev=t.level;});}
function fromXML(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.getElementsByTagName('parsererror').length)throw new Error('That XML file could not be read.');
  const ch=(el,tag)=>{for(const c of el.children)if(c.localName===tag)return c;return null;};const tv=(el,tag)=>{const c=ch(el,tag);return c?c.textContent.trim():'';};
  const root=doc.documentElement;if(root.localName!=='Project')throw new Error('This is not a Microsoft Project XML file.');
  const tasksEl=ch(root,'Tasks');if(!tasksEl)throw new Error('No tasks found in this file.');
  const res=new Map();const rEl=ch(root,'Resources');if(rEl)for(const r of rEl.children)if(r.localName==='Resource')res.set(tv(r,'UID'),tv(r,'Name'));
  const asg=new Map();const aEl=ch(root,'Assignments');if(aEl)for(const a of aEl.children){if(a.localName!=='Assignment')continue;const n=res.get(tv(a,'ResourceUID'));if(!n)continue;const k=tv(a,'TaskUID');(asg.get(k)||asg.set(k,[]).get(k)).push(n);}
  const tasks=[],byUid=new Map(),links=[];
  for(const el of tasksEl.children){if(el.localName!=='Task')continue;const ol=parseInt(tv(el,'OutlineLevel'),10);if(tv(el,'IsNull')==='1'||ol===0||isNaN(ol)&&tv(el,'UID')==='0')continue;
    const u=tv(el,'UID');const dm=tv(el,'Duration').match(/PT(\d+(?:\.\d+)?)H(\d+)M/);let dur=dm?Math.round((parseFloat(dm[1])+parseInt(dm[2],10)/60)/8):1;if(tv(el,'Milestone')==='1')dur=0;
    const s=pISO(tv(el,'Start'));const dl=pISO(tv(el,'Deadline'));
    const t={id:uid(),name:tv(el,'Name')||'Untitled task',level:Math.max(0,(ol||1)-1),dur,start:s!=null?iso(dnOf(wd(s))):null,due:dl!=null?iso(dl):null,pct:clamp(parseInt(tv(el,'PercentComplete'),10)||0,0,100),owner:(asg.get(u)||[]).join(', '),preds:[],notes:tv(el,'Notes')};
    tasks.push(t);byUid.set(u,t);
    for(const pl of el.children)if(pl.localName==='PredecessorLink')links.push([t,tv(pl,'PredecessorUID'),Math.round((parseInt(tv(pl,'LinkLag'),10)||0)/4800)]);}
  links.forEach(([t,pu,lag])=>{const p=byUid.get(pu);if(p&&p!==t)t.preds.push({id:p.id,lag});});
  fixLevels(tasks);
  const sd=pISO(tv(root,'StartDate'));return{name:tv(root,'Title')||tv(root,'Name').replace(/\.(xml|mpp)$/i,''),start:sd!=null?iso(dnOf(wd(sd))):null,tasks};
}
async function importFile(file){
  const text=await file.text();let r;const nm=file.name.replace(/\.[^.]+$/,'');
  try{
    if(/\.json$/i.test(file.name)||/^\s*\{/.test(text)){const o=JSON.parse(text);if(!Array.isArray(o.tasks))throw new Error('This JSON file has no task list.');
      r={name:o.name,start:o.start,tasks:o.tasks.map(t=>({id:String(t.id||uid()),name:String(t.name||'Untitled task'),level:Math.max(0,t.level|0),dur:Math.max(0,t.dur|0),start:t.start||null,due:t.due||null,pct:clamp(t.pct|0,0,100),owner:String(t.owner||''),preds:Array.isArray(t.preds)?t.preds.map(p=>({id:String(p.id),lag:p.lag|0})):[],notes:String(t.notes||''),collapsed:!!t.collapsed}))};fixLevels(r.tasks);}
    else if(/\.xml$/i.test(file.name)||/^\s*</.test(text))r=fromXML(text);
    else r=fromCSV(text);
  }catch(e){toast(e.message||'That file could not be imported.');return;}
  if(!r.tasks.length){toast('No tasks were found in that file.');return;}
  const starts=r.tasks.map(t=>pISO(t.start)).filter(v=>v!=null);
  const start=r.start||(starts.length?iso(Math.min(...starts)):iso(todayDN));
  r.tasks.forEach(t=>{if(!t.start)t.start=start;});
  if(sched({start,tasks:r.tasks}).cycle){r.tasks.forEach(t=>t.preds=[]);toast('Some links formed a loop, so all links were removed.');}
  await createProject(r.name||nm||'Imported project',start,r.tasks);
  toast(`Imported ${r.tasks.length} tasks`);
}

/* ---------------- events ---------------- */
function nextRowId(id,dir){const r=S.rows||[];const k=r.findIndex(i=>S.P.tasks[i].id===id);const n=k+dir;if(n<0||n>=r.length)return null;return S.P.tasks[r[n]].id;}
function cmd(c,el,e){
  switch(c){
    case'insert':insertTask(false);break;case'milestone':insertTask(true);break;case'delete':deleteSel();break;
    case'details':S.drawer=true;renderDrawer();break;case'closedrawer':S.drawer=false;renderDrawer();break;
    case'outdent':indent(-1);break;case'indent':indent(1);break;case'up':move(-1);break;case'down':move(1);break;
    case'expandall':setAllCollapsed(false);break;case'collapseall':setAllCollapsed(true);break;
    case'link':linkSel();break;case'unlink':unlinkSel();break;
    case'critical':S.critical=!S.critical;lsSet('cp.crit',S.critical);render();break;
    case'undo':undo();break;case'redo':redo();break;
    case'view':S.view=el.dataset.v;lsSet('cp.view2',S.view);render();break;
    case'zoom':{const gb=$('#ganttBody');const c0=S.g?S.g.lo+(gb.scrollLeft+gb.clientWidth/2)/S.g.dw:todayDN;S.zoom=el.dataset.z;lsSet('cp.zoom',S.zoom);render();if(S.g)gb.scrollLeft=Math.max(0,S.g.x(c0)-gb.clientWidth/2);break;}
    case'today':scrollToDN(todayDN);break;
    case'goto':{const ii=selIdx();if(ii.length)scrollToDN(S.sc.sDN[ii[0]],true);break;}
    case'columns':columnsMenu(el);break;
    case'newproj':newProjectDialog();break;case'import':$('#fileIn').click();break;
  }
}
function scrollToDN(dn,left){if(!S.g)return;const gb=$('#ganttBody');gb.scrollTo({left:Math.max(0,S.g.x(dn)-(left?40:gb.clientWidth/3)),behavior:'smooth'});}

function bind(){
  $('#newProj').innerHTML=ic('plus')+'<span class="lbl">New</span>';$('#newProj').title='New project';
  $('#moreBtn').innerHTML=ic('more').replace('class="ic"','class="ic" style="stroke-width:2.6"');
  $('#newProj').onclick=()=>newProjectDialog();
  $('#moreBtn').onclick=e=>{e.stopPropagation();if(popEl)closePop();else moreMenu(e.currentTarget);};
  $('#projSel').onchange=e=>{if(S.dirty)flush();openProject(e.target.value);};
  $('#fileIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f);};
  document.addEventListener('click',e=>{
    if(popEl&&!popEl.contains(e.target)&&!e.target.closest('[data-cmd=columns],#moreBtn'))closePop();
    const b=e.target.closest('[data-cmd]');if(b&&!b.disabled){if(b.dataset.cmd==='columns'&&popEl){closePop();return;}cmd(b.dataset.cmd,b,e);}
  });
  $('#ribbon').addEventListener('change',e=>{if(e.target.id==='ownerF'){S.owner=e.target.value;render();}});
  $('#ribbon').addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;renderGrid();renderGantt();}});
  $('#pname').addEventListener('change',e=>{const v=e.target.value.trim()||'Untitled project';commit(()=>{S.P.name=v;});setTimeout(renderPicker,0);});
  $('#pname').addEventListener('input',e=>e.target.style.setProperty('--nw',Math.max(8,e.target.value.length+2)+'ch'));
  $('#pname').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
  $('#stats').addEventListener('change',e=>{if(e.target.id==='pstart')setProjectStart(e.target.value);});

  const gbody=$('#gridBody');
  gbody.addEventListener('change',e=>{
    const inp=e.target;if(inp.dataset.new!=null){const v=inp.value.trim();if(v){inp.value='';addFromNewRow(v);S.pendingFocus={newrow:true};}return;}
    if(!inp.dataset.f)return;const row=inp.closest('.row');setField(row.dataset.id,inp.dataset.f,inp.value);
  });
  gbody.addEventListener('focusin',e=>{const row=e.target.closest('.row[data-id]');if(row&&!S.sel.has(row.dataset.id)){S.sel=new Set([row.dataset.id]);S.anchor=row.dataset.id;paintSelection();}});
  gbody.addEventListener('focusout',()=>{if(S.pendingRemote&&!S.dirty)setTimeout(()=>{const a=document.activeElement;if(S.pendingRemote&&!(a&&a.matches('#gridBody input, #drawer input, #drawer textarea')))applyRemote(S.projects[S.curId]);},50);});
  gbody.addEventListener('click',e=>{
    const a=e.target.closest('[data-act]');if(!a)return;const row=a.closest('.row[data-id]');if(!row)return;const id=row.dataset.id;
    if(a.dataset.act==='toggle')toggleCollapse(id);
    else if(a.dataset.act==='sel'){if(!e.shiftKey&&!e.ctrlKey&&!e.metaKey&&S.sel.size===1&&S.sel.has(id)){S.drawer=true;renderDrawer();}else selectRow(id,e);}
  });
  gbody.addEventListener('keydown',e=>{
    const inp=e.target;if(inp.tagName!=='INPUT')return;
    if(inp.dataset.new!=null){if(e.key==='Enter'){e.preventDefault();const v=inp.value.trim();if(v){inp.value='';addFromNewRow(v);S.pendingFocus={newrow:true};}}else if(e.key==='ArrowUp'&&S.rows&&S.rows.length){e.preventDefault();S.pendingFocus={id:S.P.tasks[S.rows[S.rows.length-1]].id,f:'name',select:true,reveal:true};inp.blur();requestRender();}return;}
    const vert=(e.key==='Enter'&&!e.altKey)||((e.key==='ArrowDown'||e.key==='ArrowUp')&&inp.type!=='number'&&inp.type!=='date'&&!e.altKey);
    if(vert){e.preventDefault();const id=inp.closest('.row').dataset.id;const dir=e.key==='ArrowUp'||(e.key==='Enter'&&e.shiftKey)?-1:1;const nid=nextRowId(id,dir);
      S.pendingFocus=nid?{id:nid,f:inp.dataset.f,select:true,reveal:true}:(dir>0&&S.canWrite?{newrow:true,reveal:true}:{id,f:inp.dataset.f});inp.blur();requestRender();}
    else if(e.key==='Escape'){inp.blur();requestRender();}
  });
  // drawer
  const dr=$('#drawer');
  dr.addEventListener('change',e=>{const f=e.target.dataset.df;if(!f)return;const id=dr.querySelector('.dbody').dataset.id;setField(id,f,f==='milestone'?e.target.checked:e.target.value);});
  dr.addEventListener('input',e=>{if(e.target.dataset.df==='pct'){const l=e.target.previousElementSibling;if(l)l.textContent='% Complete — '+e.target.value+'%';}});
  // scroll sync
  const gB=$('#ganttBody'),gH=$('#ganttHead'),rH=$('#gridHead');
  gbody.addEventListener('scroll',()=>{rH.scrollLeft=gbody.scrollLeft;if(gB.scrollTop!==gbody.scrollTop)gB.scrollTop=gbody.scrollTop;},{passive:true});
  gB.addEventListener('scroll',()=>{gH.scrollLeft=gB.scrollLeft;if(gbody.scrollTop!==gB.scrollTop)gbody.scrollTop=gB.scrollTop;},{passive:true});
  // gantt interactions
  let drag=null,tipEl=null;
  gB.addEventListener('pointerdown',e=>{
    const g=e.target.closest('[data-id]');if(!g||!S.P)return;const id=g.dataset.id;
    if(!g.hasAttribute('data-drag')||e.button!==0){if(g.classList.contains('rowbg')||g.classList.contains('sumg')||g.classList.contains('bar')||g.classList.contains('ms'))selectRow(id,e);return;}
    const i=taskIdx(id);drag={id,i,g,x0:e.clientX,mode:e.target.classList.contains('hd')?'resize':'move',moved:false,days:0,pid:e.pointerId,ev:e};
    g.setPointerCapture(e.pointerId);e.preventDefault();
  });

    if(!drag||e.pointerId!==drag.pid)return;const dx=e.clientX-drag.x0;if(!drag.moved&&Math.abs(dx)<4)return;
    if(!drag.moved){drag.moved=true;drag.g.classList.add('dragging');tipEl=document.createElement('div');tipEl.className='drag-tip';document.body.appendChild(tipEl);}
    const sc=S.sc,i=drag.i,days=Math.round(dx/S.g.dw);drag.days=days;
    let s=sc.sDN[i],f=sc.fDN[i];
    if(drag.mode==='move'){s=dnOf(wd(s+days));f=sc.dur[i]?dnOf(wd(s)+sc.dur[i]-1):s;drag.g.setAttribute('transform',`translate(${(s-sc.sDN[i])*S.g.dw},0)`);}
    else{const fw=Math.max(sc.Sw[i],finWD(sc.fDN[i]+days));f=dnOf(fw);const w=Math.max(3,S.g.x(f+1)-S.g.x(s)-1);
      drag.g.querySelector('.tr').setAttribute('width',w);drag.g.querySelector('.pr').setAttribute('width',w*sc.pct[i]/100);}
    tipEl.textContent=`${fmtL(s)} → ${fmtL(f)} · ${fmtDur(drag.mode==='move'?sc.dur[i]:wd(f)-sc.Sw[i]+1)}`;
    tipEl.style.left=Math.min(window.innerWidth-260,e.clientX+14)+'px';tipEl.style.top=(e.clientY+18)+'px';
  });
  const endDrag=e=>{
    if(!drag||e.pointerId!==drag.pid)return;const d=drag;drag=null;if(tipEl){tipEl.remove();tipEl=null;}
    if(!d.moved){selectRow(d.id,d.ev);return;}
    d.g.classList.remove('dragging');const sc=S.sc,i=d.i,t=S.P.tasks[i];
    if(e.type==='pointercancel'||!d.days){render();return;}

  gB.addEventListener('dblclick',e=>{const g=e.target.closest('.bar,.ms,.sumg');if(g){S.sel=new Set([g.dataset.id]);S.drawer=true;paintSelection();}});

  sp.addEventListener('pointerdown',e=>{sp.setPointerCapture(e.pointerId);sp.classList.add('drag');const r=work.getBoundingClientRect();
    const mv=ev=>{const w=clamp(ev.clientX-r.left,200,r.width-160);work.style.setProperty('--left',w+'px');};
    const up=ev=>{sp.classList.remove('drag');sp.removeEventListener('pointermove',mv);sp.removeEventListener('pointerup',up);const v=parseInt(getComputedStyle(work).getPropertyValue('--left'),10);if(v){lsSet('cp.left2',v);S.userLeft=true;}renderGantt();};
    sp.addEventListener('pointermove',mv);sp.addEventListener('pointerup',up);});
  // keyboard
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closePop();closeModal();if(S.drawer){S.drawer=false;renderDrawer();}return;}
    if(!S.P||document.querySelector('.scrim'))return;
    const a=document.activeElement,typing=a&&(a.matches('textarea,select')||(a.tagName==='INPUT'&&!['checkbox','range'].includes(a.type)));
    const mod=e.ctrlKey||e.metaKey;
    if(e.altKey&&e.shiftKey&&['ArrowRight','ArrowLeft','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(a&&a.blur&&typing)a.blur();
      setTimeout(()=>{({ArrowRight:()=>indent(1),ArrowLeft:()=>indent(-1),ArrowUp:()=>move(-1),ArrowDown:()=>move(1)})[e.key]();},0);return;}
    if(typing)return;
    if(mod&&e.key.toLowerCase()==='z'&&!e.shiftKey){e.preventDefault();undo();}
    else if(mod&&(e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey))){e.preventDefault();redo();}

    lastW=window.innerWidth;

    if(S.P)render();},200);});
  window.addEventListener('beforeunload',()=>{if(S.dirty)flush();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.dirty)flush();});
}

/* ---------------- boot ---------------- */
async function init(){
  bind();render();setStat('saving','Connecting…');
  const C=window.claude&&typeof window.claude.use==='function'?window.claude:null;
  if(C){C.use('downloads').then(d=>{S.dl=d;}).catch(()=>{});}
  let db=null;if(C){try{db=await C.use('db');}catch(e){db=null;}}
  if(db){
    S.mode='db';S.db=db;setStat('ok','Synced');
    try{const u=await C.use('user');if(u){const can=await u.can('data.write');if(can===false){S.canWrite=false;setReadOnly(true);}}}catch(e){}
    db.collection('projects').onSnapshot(onProjects,onDbError);
    setTimeout(()=>{if(!S.loaded){S.loaded=true;S.mode='db';render();}},8000);
  }else{S.mode='local';loadLocal();setStat('local','Saved in this browser');}
}
init();
})();
